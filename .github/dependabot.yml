version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      prisma:
        patterns:
          - prisma
          - "@prisma/*"
      discord:
        patterns:
          - discord.js
          - discordx
          - "@discordx/*"
          - "@discordjs/*"
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
